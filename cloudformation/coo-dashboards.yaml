AWSTemplateFormatVersion: '2010-09-09'
Description: COO Dashboards — Cloudelligent Operations. Synced from live QuickSight
  analysis. DO NOT EDIT MANUALLY — regenerate with scripts/sync_coo_dashboard_iac.py
Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
    - dev
    - staging
    - prod
  QuickSightUsername:
    Type: String
    Description: QuickSight email-based username (for ARN)
  QuickSightOwnerArn:
    Type: String
    Description: Full QuickSight user ARN for owner permissions
  AwsAccountId:
    Type: String
    Description: AWS Account ID
Resources:
  CooOperationalAnalysis:
    Type: AWS::QuickSight::Analysis
    Properties:
      AwsAccountId:
        Ref: AwsAccountId
      AnalysisId:
        Fn::Sub: coo-operational-analysis-${Environment}
      Name:
        Fn::Sub: COO Operational Analysis (${Environment})
      ThemeArn:
        Fn::ImportValue: CloudelligentQuickSightThemeArn
      Definition:
        DataSetIdentifierDeclarations:
        - Identifier: ps_at_risk
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/ps-projects-at-risk
        - Identifier: capacity_plan
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/resource-capacity-plan
        - Identifier: escalations
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/escalations-detail
        - Identifier: productive_util
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/productive-utilization
        - Identifier: ps_stage
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/ps-stage-trend
        - Identifier: compliance
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/clockify-missing-time-submissions-prod
        - Identifier: mc_at_risk
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/mc-projects-at-risk
        - Identifier: spice_freshness
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/spice-freshness
        - Identifier: project_hours_summary
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/project-hours-summary-prod
        - Identifier: ps_projects
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/ps-project-status-view
        - Identifier: kpi_snapshots
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/kpi-weekly-snapshots-prod
        - Identifier: mc_activity
          DataSetArn: arn:aws:quicksight:us-east-1:961341524729:dataset/mc-ticket-activity
        Sheets:
        - SheetId: sheet-weekly-pulse
          Name: Weekly Pulse
          ParameterControls:
          - DateTimePicker:
              ParameterControlId: ctrl-week-s1
              Title: Reporting Week
              SourceParameterName: pWeekStart
              DisplayOptions:
                TitleOptions:
                  Visibility: VISIBLE
                  FontConfiguration:
                    FontSize:
                      Relative: MEDIUM
                DateTimeFormat: YYYY-MM-DD
          Visuals:
          - KPIVisual:
              VisualId: kpi-billable-util
              Title:
                Visibility: VISIBLE
                FormatText:
                  PlainText: Billable Utilization
              Subtitle:
                Visibility: VISIBLE
              ChartConfiguration:
                FieldWells:
                  Values:
                  - NumericalMeasureField:
                      FieldId: kpi-billable-util-v
                      Column:
                        DataSetIdentifier: kpi_snapshots
                        ColumnName: billable_util_pct
                      AggregationFunction:
                        SimpleNumericalAggregation: MAX
                  TargetValues:
                  - NumericalMeasureField:
                      FieldId: kpi-billable-util-target
                      Column:
                        DataSetIdentifier: kpi_snapshots
                        ColumnName: billable_util_prev
                      AggregationFunction:
                        SimpleNumericalAggregation: MAX
                  TrendGroups: []
                SortConfiguration: {}
                KPIOptions:
                  Comparison:
                    ComparisonMethod: DIFFERENCE
                  PrimaryValueDisplayType: ACTUAL
                  Sparkline:
                    Visibility: HIDDEN
                    Type: LINE
                    TooltipVisibility: HIDDEN
              Actions: []
              ColumnHierarchies: []
